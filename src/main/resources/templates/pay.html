<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>订单支付 · 客官请</title>
    <style>
        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
        }

        body {
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
            padding: 16px 12px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 24px 22px;
            background-color: #fff;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            transition: all 0.2s;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f0f0f0;
        }

        .header h1 {
            color: #1a1a1a;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* 订单信息卡片 */
        .order-info {
            margin-bottom: 30px;
            padding: 22px 20px;
            background-color: #fafafa;
            border-radius: 18px;
            border: 1px solid #f0f0f0;
        }

        .order-info h2 {
            margin-bottom: 16px;
            font-size: 18px;
            color: #4a4a4a;
            font-weight: 550;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .goods-list {
            margin-bottom: 12px;
        }

        .goods-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed #e6e6e6;
            color: #3a3a3a;
        }

        .goods-item:last-child {
            border-bottom: none;
        }

        .payment-amount {
            text-align: right;
            font-size: 22px;
            font-weight: 700;
            color: #c0392b;
            margin-top: 16px;
            padding-top: 10px;
            border-top: 1px solid #eaeaea;
        }

        /* 支付方式区域 */
        .payment-method {
            margin-bottom: 20px;
        }

        .payment-method h2 {
            margin-bottom: 16px;
            font-size: 18px;
            color: #4a4a4a;
            font-weight: 550;
        }

        .method-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            border-bottom: 1px solid #eee;
            padding-bottom: 6px;
        }

        .tab {
            padding: 10px 22px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            color: #666;
            border-radius: 40px;
            transition: all 0.2s ease;
            background: #f5f5f5;
            margin-right: 6px;
        }

        .tab.active {
            color: white;
            background: #3498db;
            border-bottom: none;
            box-shadow: 0 4px 10px rgba(52,152,219,0.2);
        }

        .qrcode-container {
            text-align: center;
            padding: 28px 20px;
            background-color: #ffffff;
            border-radius: 20px;
            border: 1px solid #f0f0f0;
            min-height: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.02);
        }

        .qrcode {
            max-width: 240px;
            width: 100%;
            margin-bottom: 18px;
            background: white;
            padding: 8px;
            border-radius: 16px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.05);
        }

        .qrcode img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 10px;
            border: 1px solid #f1f1f1;
        }

        .payment-tip {
            color: #7f8c8d;
            font-size: 14px;
            margin-top: 8px;
            background: #f9f9f9;
            padding: 8px 18px;
            border-radius: 40px;
            display: inline-block;
        }

        /* ---------- 等待定价区域 (已移除左侧黄色边框) ---------- */
        .waiting-pricing {
            text-align: center;
            padding: 36px 24px;
            background: linear-gradient(145deg, #fff9e6, #fffef8);
            border-radius: 32px;
            margin-bottom: 30px;
            /* border-left 已删除，无黄色边 */
            box-shadow: 0 12px 28px rgba(255, 160, 0, 0.08);
            position: relative;
            transition: all 0.2s;
        }

        .waiting-pricing h3 {
            color: #e67e22;
            margin-bottom: 18px;
            font-size: 26px;
            font-weight: 650;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(255,140,0,0.06);
        }

        .waiting-pricing p {
            color: #5e5e5e;
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 8px;
            font-weight: 400;
        }

        .waiting-pricing p:nth-of-type(2) {
            font-size: 18px;
            margin-top: 10px;
            color: #7e57c2;
            font-weight: 450;
        }

        /* 📋 客官须知 —— 超棒按钮 ✨ */
        .btn-know {
            display: inline-block;
            background: linear-gradient(145deg, #ff9800, #fb8c00);
            color: white;
            padding: 14px 36px;
            border-radius: 60px;
            text-decoration: none;
            font-weight: 600;
            font-size: 18px;
            margin-top: 24px;
            margin-bottom: 8px;
            border: none;
            box-shadow: 0 12px 22px rgba(255, 140, 0, 0.25);
            transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
            letter-spacing: 1.2px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            line-height: 1.2;
        }

        .btn-know:hover {
            background: linear-gradient(145deg, #f57c00, #ef6c00);
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 20px 28px rgba(255, 112, 0, 0.35);
            color: white;
            border-color: rgba(255, 255, 255, 0.3);
        }

        .btn-know:active {
            transform: translateY(0) scale(0.98);
            box-shadow: 0 8px 16px rgba(255, 112, 0, 0.4);
        }

        .btn-know::before {
            content: "📋";
            margin-right: 10px;
            font-size: 20px;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.1));
        }

        /* 隐藏类 */
        .hidden {
            display: none !important;
        }

        /* 加载错误状态 */
        .error {
            text-align: center;
            padding: 50px 20px;
            color: #e74c3c;
            background: #fff5f5;
            border-radius: 28px;
        }
        .error h2 {
            font-size: 22px;
            margin-bottom: 12px;
        }
        .error button {
            margin-top: 24px;
            padding: 12px 28px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(52,152,219,0.3);
            transition: all 0.2s;
        }
        .error button:hover {
            background: #2980b9;
            transform: scale(1.02);
        }

        /* 响应式优化 */
        @media (max-width: 600px) {
            body {
                padding: 10px 8px;
            }
            .container {
                padding: 20px 16px;
                border-radius: 20px;
            }
            .header h1 {
                font-size: 24px;
            }
            .qrcode {
                max-width: 200px;
            }
            .method-tabs {
                justify-content: space-between;
            }
            .tab {
                padding: 8px 18px;
                font-size: 15px;
            }
            .waiting-pricing {
                padding: 28px 18px;
            }
            .waiting-pricing h3 {
                font-size: 22px;
            }
            .btn-know {
                padding: 12px 28px;
                font-size: 17px;
                margin-top: 20px;
            }
        }

        @media (max-width: 380px) {
            .btn-know {
                padding: 10px 22px;
                font-size: 16px;
            }
        }

        /* 等待区域装饰微光 */
        .waiting-pricing::after {
            content: "✨";
            position: absolute;
            bottom: 12px;
            right: 20px;
            font-size: 26px;
            opacity: 0.2;
            transform: rotate(8deg);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🧾 订单支付</h1>
    </div>

    <!-- 等待管理员定价区域（已移除左边黄边） -->
    <div id="waitingPricing" class="waiting-pricing hidden">
        <h3>⏳ 等待管理员定价</h3>
        <p>请在QQ上联系管理员完成定价</p>
        <p>(,,・ω・,,)♡</p>
        <p>购买前请看“客观须知”再决定哦👇</p>
        <a href="/user/instructions" class="btn-know">客官须知</a>
    </div>

    <!-- 订单信息（动态填充） -->
    <div id="orderInfo" class="order-info">
        <!-- JS会动态注入 -->
    </div>

    <!-- 支付方式选择区 -->
    <div id="paymentMethod" class="payment-method">
        <h2>💳 选择支付方式</h2>
        <div class="method-tabs">
            <div class="tab active" data-method="wxpay">微信支付</div>
            <div class="tab" data-method="alipay">支付宝支付</div>
        </div>

        <div class="qrcode-container">
            <!-- 微信支付码容器 -->
            <div class="qrcode" id="wxpayQRcode"></div>
            <!-- 支付宝支付码容器 -->
            <div class="qrcode" id="alipayQRcode" style="display: none;"></div>
            <p class="payment-tip">长按或右键保存图片，请使用手机扫描二维码完成支付</p>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        fetch('/user/topay')
            .then(response => {
                if (!response.ok) {
                    throw new Error('网络响应不正常');
                }
                return response.json();
            })
            .then(data => {
                if (data.Go === 0) {
                    showWaitingPricing();
                } else {
                    updateOrderInfo(data);
                    updateQRcodes(data);
                    setupPaymentTabs();
                    showPaymentArea();
                }
            })
            .catch(error => {
                console.error('获取支付数据失败:', error);
                showError('获取支付信息失败，请刷新页面重试');
            });
    });

    function showWaitingPricing() {
        document.getElementById('waitingPricing').classList.remove('hidden');
        document.getElementById('orderInfo').classList.add('hidden');
        document.getElementById('paymentMethod').classList.add('hidden');
    }

    function showPaymentArea() {
        document.getElementById('waitingPricing').classList.add('hidden');
        document.getElementById('orderInfo').classList.remove('hidden');
        document.getElementById('paymentMethod').classList.remove('hidden');
    }

    function updateOrderInfo(data) {
        const orderInfoDiv = document.getElementById('orderInfo');
        let goodsListHTML = '';
        if (data.goodsNames && data.goodsNames.length > 0) {
            data.goodsNames.forEach(goodsName => {
                goodsListHTML += `
                        <div class="goods-item">
                            <span>📦 ${goodsName}</span>
                            <span>×1</span>
                        </div>
                    `;
            });
        }
        orderInfoDiv.innerHTML = `
                <h2>订单详情</h2>
                <div class="goods-list">
                    ${goodsListHTML}
                </div>
                <div class="payment-amount">
                    总计: ¥${data.money || 0}
                </div>
            `;
    }

    function updateQRcodes(data) {
        const wxQRcodeDiv = document.getElementById('wxpayQRcode');
        const aliQRcodeDiv = document.getElementById('alipayQRcode');
        wxQRcodeDiv.innerHTML = data.wxpayQRcode ? `<img src="${data.wxpayQRcode}" alt="微信支付二维码">` : `<div style="padding:20px; color:#999;">待生成微信码</div>`;
        aliQRcodeDiv.innerHTML = data.alipayQRcode ? `<img src="${data.alipayQRcode}" alt="支付宝支付二维码">` : `<div style="padding:20px; color:#999;">待生成支付宝码</div>`;
    }

    function setupPaymentTabs() {
        const tabs = document.querySelectorAll('.tab');
        tabs.forEach(tab => {
            const newTab = tab.cloneNode(true);
            tab.parentNode.replaceChild(newTab, tab);
        });
        const freshTabs = document.querySelectorAll('.tab');
        freshTabs.forEach(tab => {
            tab.addEventListener('click', function(e) {
                freshTabs.forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                const method = this.getAttribute('data-method');
                document.getElementById('wxpayQRcode').style.display = method === 'wxpay' ? 'block' : 'none';
                document.getElementById('alipayQRcode').style.display = method === 'alipay' ? 'block' : 'none';
            });
        });
    }

    function showError(message) {
        const container = document.querySelector('.container');
        container.innerHTML = `
                <div class="error">
                    <h2>😵 加载失败</h2>
                    <p>${message}</p>
                    <button onclick="location.reload()">刷新页面</button>
                </div>
            `;
    }
</script>
</body>
</html>
